name: Build mobile GL1800 APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write   # для публикации APK в Releases
  pages: write
  id-token: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  # ШАГ 1. Превью: веб-версия приложения на GitHub Pages
  preview:
    runs-on: ubuntu-latest
    continue-on-error: true   # если Pages не включены, сборка APK всё равно пойдёт
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'


      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deploy
        uses: actions/deploy-pages@v4

  # ШАГ 2. Сборка APK (запускается только после превью)
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Android SDK уже установлен на runner'е (ANDROID_HOME), отдельная установка не нужна
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'


      - name: Verify Russian manual before packaging
        run: |
          python -m pip install "PyMuPDF==1.26.7"
          python scripts/verify_ru_manual.py www/manual.pdf

      - name: Add Android platform
        run: |
          npx cap add android
          npx cap sync android

      - name: Install image generator dependency
        run: python3 -m pip install --user Pillow

      - name: Apply requested gold Honda Gold Wing icon (thin frame)
        run: |
          python3 - <<'PY'
          import base64
          from io import BytesIO
          from pathlib import Path
          from PIL import Image

          # Store image losslessly as a repository-verified base64 WebP asset.
          encoded = Path("assets/gl1800-thin-gold-icon.webp.b64").read_text().strip()
          original = Image.open(BytesIO(base64.b64decode(encoded, validate=True))).convert("RGBA")
          if original.size != (160, 160):
              raise RuntimeError(f"Unexpected app icon source dimensions: {original.size}")

          root = Path("android/app/src/main/res")
          for folder, px in [
              ("mipmap-mdpi", 48),
              ("mipmap-hdpi", 72),
              ("mipmap-xhdpi", 96),
              ("mipmap-xxhdpi", 144),
              ("mipmap-xxxhdpi", 192),
          ]:
              dest = root / folder
              dest.mkdir(parents=True, exist_ok=True)

              # Legacy launchers show the full square icon.
              launcher = original.resize((px, px), Image.Resampling.LANCZOS)
              launcher.save(dest / "ic_launcher.png")
              launcher.save(dest / "ic_launcher_round.png")

              # Adaptive launchers crop to a system-controlled shape. Give
              # the emblem padding so the gold text and wing survive the mask.
              fg_px = round(px * 108 / 48)
              fg = Image.new("RGBA", (fg_px, fg_px), (0, 0, 0, 0))
              emblem_px = round(fg_px * 0.64)
              emblem = original.resize((emblem_px, emblem_px), Image.Resampling.LANCZOS)
              fg.alpha_composite(emblem, ((fg_px - emblem_px) // 2, (fg_px - emblem_px) // 2))
              fg.save(dest / "ic_launcher_foreground.png")

          # Ensure adaptive icon padding has a dark background.
          values = root / "values"
          values.mkdir(parents=True, exist_ok=True)
          (values / "ic_launcher_background.xml").write_text(
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<resources><color name="ic_launcher_background">#050505</color></resources>\n',
              encoding="utf-8",
          )
          print("Honda Gold Wing thin gold-frame icon applied to all Android densities")
          PY

      - name: Build installable debug APK
        working-directory: android
        run: bash ./gradlew assembleDebug --no-daemon

      - name: Prepare downloadable APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk GL1800-manual.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GL1800-manual-installable
          path: |
            GL1800-manual.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: GL1800, установочная сборка ${{ github.run_number }}
          files: |
            GL1800-manual.apk
