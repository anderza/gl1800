name: Preview and build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write   # для публикации APK в Releases
  pages: write
  id-token: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  # ШАГ 1. Превью: веб-версия приложения на GitHub Pages
  preview:
    runs-on: ubuntu-latest
    continue-on-error: true   # если Pages не включены, сборка APK всё равно пойдёт
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deploy
        uses: actions/deploy-pages@v4

  # ШАГ 2. Сборка APK (запускается только после превью)
  build:
    needs: preview
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Android SDK уже установлен на runner'е (ANDROID_HOME), отдельная установка не нужна
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: |
          npx cap add android
          npx cap sync android

      - name: Install image generator dependency
        run: python3 -m pip install --user Pillow

      - name: Apply black and gold Gold Wing app icon
        run: |
          python3 - <<'PY'
          import os, struct, zlib, math
          from PIL import Image, ImageDraw, ImageFont
          size=512
          im=Image.new('RGBA',(size,size),'#050505')
          d=ImageDraw.Draw(im)
          gold='#DDAF36'
          d.rounded_rectangle((13,13,499,499),radius=86,outline=gold,width=14)
          for y in range(3):
              for side in (-1,1):
                  x0=256
                  x1=256+side*(175-y*22)
                  d.polygon([(x0,170+y*20),(x1,87+y*24),(x1-side*30,111+y*24),(x0,184+y*20)],fill=gold)
          font='/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'
          for label,y,sz in [('GOLD WING',260,47),('GL1800',337,72),('SERVICE MANUAL',430,24)]:
              ft=ImageFont.truetype(font,sz)
              bb=d.textbbox((0,0),label,font=ft)
              d.text(((512-(bb[2]-bb[0]))/2,y),label,font=ft,fill=gold)
          for folder,px in [('mipmap-mdpi',48),('mipmap-hdpi',72),('mipmap-xhdpi',96),('mipmap-xxhdpi',144),('mipmap-xxxhdpi',192)]:
              path='android/app/src/main/res/'+folder
              os.makedirs(path,exist_ok=True)
              icon=im.resize((px,px),Image.Resampling.LANCZOS)
              for name in ('ic_launcher.png','ic_launcher_round.png','ic_launcher_foreground.png'):
                  icon.save(os.path.join(path,name))
          PY

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Нет секрета KEYSTORE_BASE64. См. SECRETS.txt"
            exit 1
          fi

      - name: Build release APK and AAB (unsigned)
        working-directory: android
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Sign APK and AAB
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          UNSIGNED=$(ls android/app/build/outputs/apk/release/*.apk | head -1)

          # APK: выравнивание + подпись (v1-v3)
          "$BT/zipalign" -p -f 4 "$UNSIGNED" aligned.apk
          KS_PASS="$KEYSTORE_PASSWORD" K_PASS="$KEY_PASSWORD" "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/release.keystore" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KS_PASS --key-pass env:K_PASS \
            --out GL1800-manual.apk aligned.apk
          "$BT/apksigner" verify --print-certs GL1800-manual.apk

          # AAB для Google Play
          cp android/app/build/outputs/bundle/release/app-release.aab GL1800-manual.aab
          jarsigner -keystore "$RUNNER_TEMP/release.keystore" \
            -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" \
            GL1800-manual.aab "$KEY_ALIAS"

          rm -f "$RUNNER_TEMP/release.keystore" aligned.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GL1800-manual-release
          path: |
            GL1800-manual.apk
            GL1800-manual.aab

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: GL1800, сборка ${{ github.run_number }}
          files: |
            GL1800-manual.apk
            GL1800-manual.aab
