name: Preview and build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write   # для публикации APK в Releases
  pages: write
  id-token: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  # ШАГ 1. Превью: веб-версия приложения на GitHub Pages
  preview:
    runs-on: ubuntu-latest
    continue-on-error: true   # если Pages не включены, сборка APK всё равно пойдёт
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deploy
        uses: actions/deploy-pages@v4

  # ШАГ 2. Сборка APK (запускается только после превью)
  build:
    needs: preview
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Android SDK уже установлен на runner'е (ANDROID_HOME), отдельная установка не нужна
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: |
          npx cap add android
          npx cap sync android

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Нет секрета KEYSTORE_BASE64. См. SECRETS.txt"
            exit 1
          fi

      - name: Build release APK and AAB (unsigned)
        working-directory: android
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Sign APK and AAB
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          UNSIGNED=$(ls android/app/build/outputs/apk/release/*.apk | head -1)

          # APK: выравнивание + подпись (v1-v3)
          "$BT/zipalign" -p -f 4 "$UNSIGNED" aligned.apk
          KS_PASS="$KEYSTORE_PASSWORD" K_PASS="$KEY_PASSWORD" "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/release.keystore" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KS_PASS --key-pass env:K_PASS \
            --out GL1800-manual.apk aligned.apk
          "$BT/apksigner" verify --print-certs GL1800-manual.apk

          # AAB для Google Play
          cp android/app/build/outputs/bundle/release/app-release.aab GL1800-manual.aab
          jarsigner -keystore "$RUNNER_TEMP/release.keystore" \
            -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" \
            GL1800-manual.aab "$KEY_ALIAS"

          rm -f "$RUNNER_TEMP/release.keystore" aligned.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GL1800-manual-release
          path: |
            GL1800-manual.apk
            GL1800-manual.aab

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: GL1800, сборка ${{ github.run_number }}
          files: |
            GL1800-manual.apk
            GL1800-manual.aab
