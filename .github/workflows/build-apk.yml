name: Preview and Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch: # Позволяет запустить сборку вручную кнопкой

jobs:
  # Задача 1: Подготовка файлов для превью (Pages)
  # continue-on-error: true гарантирует, что даже при ошибке здесь, APK всё равно соберётся
  preview:
    name: Build Preview
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Upload preview artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'www' # Укажите 'dist', если ваш проект собирается в папку dist

  # Задача 2: Сборка Android APK (запускается независимо от результата preview)
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    # Мы НЕ добавляем "needs: preview", поэтому эта задача начнётся сразу и не зависит от превью
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release-key.keystore

      - name: Build APK
        run: cd android && ./gradlew assembleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Rename APK
        run: mv android/app/build/outputs/apk/release/app-release.apk GL1800-manual.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Сборка №${{ github.run_number }}
          files: GL1800-manual.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
