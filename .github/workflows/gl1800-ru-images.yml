name: GL1800 Russian PNG APK
on:
  push:
    branches: [gl1800-russian-html-images]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and unpack all Russian pages
        shell: bash
        run: |
          set -euo pipefail
          test -s www/data.js || { echo "Missing Russian image-page data.js"; exit 1; }
          grep -q 'pages/p' www/index.html || { echo "Wrong HTML viewer: expected PNG page viewer"; exit 1; }
          mkdir -p www/pages
          archives=(www/pages-*.zip)
          test "${#archives[@]}" -eq 8 || { echo "All 8 page archives are required"; exit 1; }
          for a in "${archives[@]}"; do unzip -oq "$a" -d www; done
          count=$(find www/pages -maxdepth 1 -name 'p???.png' | wc -l)
          test "$count" -eq 757 || { echo "Expected 757 PNG pages, found $count"; exit 1; }
          test -s www/pages/p001.png
          test -s www/pages/p757.png
          rm -f www/manual.pdf www/manual_ru.pdf www/pages-*.zip
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm install --no-audit --no-fund
      - run: |
          npx cap add android
          npx cap sync android
      - name: Assemble installable APK
        working-directory: android
        run: bash ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk GL1800-RU.apk
      - uses: actions/upload-artifact@v4
        with:
          name: GL1800-RU-APK
          path: GL1800-RU.apk
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ru-${{ github.run_number }}
          name: GL1800 RU ${{ github.run_number }}
          files: GL1800-RU.apk
