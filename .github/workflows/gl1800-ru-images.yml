name: GL1800 Russian PNG APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download translated HTML bundle from Google Drive
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --user "gdown==5.2.0"
          python -m gdown "https://drive.google.com/uc?id=1qgcUc0OC7fTcSlU7ZNOBrykVeA4dSQJ7" -O /tmp/GL1800_RU_HTML_Android_GitHub.zip
          unzip -tq /tmp/GL1800_RU_HTML_Android_GitHub.zip
          unzip -oq /tmp/GL1800_RU_HTML_Android_GitHub.zip -d .
      - name: Validate 757 translated PNG pages and offline HTML
        shell: bash
        run: |
          set -euo pipefail
          test -s www/index.html
          test -s www/data.js
          grep -q 'pages/p' www/index.html
          mkdir -p www/pages
          for i in $(seq -w 1 8); do
            a="www/pages-${i}.zip"
            test -s "$a" || { echo "Missing translated pages archive $a"; exit 1; }
            unzip -oq "$a" -d www
          done
          count=$(find www/pages -maxdepth 1 -name 'p???.png' | wc -l)
          test "$count" -eq 757 || { echo "Expected 757 Russian PNG pages, found $count"; exit 1; }
          test -s www/pages/p001.png
          test -s www/pages/p757.png
          rm -f www/manual.pdf www/manual_ru.pdf www/pages-*.zip
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm install --no-audit --no-fund
      - run: |
          npx cap add android
          npx cap sync android
      - name: Assemble installable APK
        working-directory: android
        run: bash ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk GL1800-RU.apk
      - uses: actions/upload-artifact@v4
        with:
          name: GL1800-RU-APK
          path: GL1800-RU.apk
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ru-${{ github.run_number }}
          name: GL1800 RU ${{ github.run_number }}
          files: GL1800-RU.apk
