name: GL1800 Russian PNG APK
on:
  push:
    branches: [gl1800-russian-html-images]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and inspect Russian manual bundle
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Download/extraction failed at line $LINENO (exit $?)"' ERR
          python -m pip install "gdown==5.2.0"
          python -m gdown --fuzzy "https://drive.google.com/file/d/1qgcUc0OC7fTcSlU7ZNOBrykVeA4dSQJ7/view" -O /tmp/gl1800-ru.zip
          echo "Download size and file type:"
          ls -lh /tmp/gl1800-ru.zip
          file /tmp/gl1800-ru.zip
          unzip -tq /tmp/gl1800-ru.zip
          echo "Checking that Google Drive has the translated image edition, not the old PDF edition"
          unzip -Z1 /tmp/gl1800-ru.zip | grep -Fx 'www/data.js' || { echo "::error::Google Drive still contains the old English PDF package"; exit 1; }
          unzip -Z1 /tmp/gl1800-ru.zip | grep -Fx 'www/pages-08.zip' || { echo "::error::Russian image archives are missing"; exit 1; }
          unzip -oq /tmp/gl1800-ru.zip -d .
          echo "Extracted HTML bundle:"
          find www -maxdepth 1 -type f -printf '%f %s bytes\\n' | sort
      - name: Validate and unpack all 757 translated PNG pages
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Validation failed at line $LINENO (exit $?)"' ERR
          test -s www/index.html || { echo "::error::Missing www/index.html"; exit 1; }
          test -s www/data.js || { echo "::error::Missing www/data.js"; exit 1; }
          grep -Fq 'pages/p' www/index.html || { echo "::error::HTML is not the translated image viewer"; exit 1; }
          mkdir -p www/pages
          for i in $(seq 1 8); do
            printf -v suffix '%02d' "$i"
            archive="www/pages-${suffix}.zip"
            test -s "$archive" || { echo "::error::Missing $archive"; exit 1; }
            echo "Extracting $archive"
            unzip -oq "$archive" -d www
          done
          count=$(find www/pages -maxdepth 1 -name 'p???.png' | wc -l)
          echo "Translated pages found: $count"
          test "$count" -eq 757 || { echo "::error::Expected 757 Russian PNG pages, found $count"; exit 1; }
          test -s www/pages/p001.png || { echo "::error::Missing p001.png"; exit 1; }
          test -s www/pages/p757.png || { echo "::error::Missing p757.png"; exit 1; }
          rm -f www/manual.pdf www/manual_ru.pdf www/pages-*.zip
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm install --no-audit --no-fund
      - run: |
          npx cap add android
          npx cap sync android
      - name: Assemble installable APK
        working-directory: android
        run: bash ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk GL1800-RU.apk
      - uses: actions/upload-artifact@v4
        with:
          name: GL1800-RU-APK
          path: GL1800-RU.apk
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ru-${{ github.run_number }}
          name: GL1800 RU ${{ github.run_number }}
          files: GL1800-RU.apk
