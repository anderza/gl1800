<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GL1800 — сервисное руководство</title>
<style>
:root{
  --bg:#f4f3ef; --panel:#ffffff; --ink:#1c1d1f; --muted:#6b6d72; --line:#dcdad3;
  --accent:#b3261e; --accent-ink:#ffffff; --hover:#ecebe5; --sel:#f6e3e1; --page:#ffffff;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#161718; --panel:#1f2022; --ink:#e9e8e4; --muted:#9a9ca1; --line:#323438;
         --accent:#e2554b; --accent-ink:#ffffff; --hover:#2a2c2f; --sel:#3a2422; --page:#f7f7f5; }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
     display:grid;grid-template-rows:auto minmax(0,1fr);grid-template-columns:320px minmax(0,1fr);grid-template-areas:"top top" "toc main";}
a{color:inherit}
header{grid-area:top;display:flex;gap:10px;align-items:center;padding:10px 16px;background:var(--panel);
       border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:baseline;gap:8px;text-decoration:none;white-space:nowrap}
.brand b{font-size:17px;letter-spacing:.02em}
.brand span{color:var(--muted);font-size:13px}
.brand .wing{width:10px;height:22px;background:var(--accent);display:inline-block;align-self:center;border-radius:2px}
.search{flex:1;max-width:520px;margin-left:auto;position:relative}
.search input,.jump input{width:100%;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);
       color:var(--ink);font:inherit}
.jump{width:110px}
.burger{display:none;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:6px 10px;font-size:16px}
nav#toc{grid-area:toc;overflow:auto;border-right:1px solid var(--line);background:var(--panel);padding:8px 0 40px}
.sec{border-bottom:1px solid var(--line)}
.sec>button{all:unset;cursor:pointer;display:grid;grid-template-columns:30px 1fr auto;gap:6px;align-items:center;
       width:100%;padding:9px 14px;box-sizing:border-box}
.sec>button:hover{background:var(--hover)}
.sec .num{font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.sec .t{font-weight:600;font-size:13.5px;line-height:1.25}
.sec .cnt{font-size:11.5px;color:var(--muted)}
.sec.open>button{background:var(--hover)}
.plist{display:none;padding:2px 0 8px}
.sec.open .plist{display:block}
.plist a{display:grid;grid-template-columns:52px 1fr;gap:6px;padding:4px 14px 4px 22px;text-decoration:none;font-size:13px;color:var(--ink)}
.plist a:hover{background:var(--hover)}
.plist a.cur{background:var(--sel)}
.plist a .pn{color:var(--muted);font-variant-numeric:tabular-nums}
.plist a>span:last-child{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.en{display:inline-block;font-size:10px;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:4px;vertical-align:1px}
main{grid-area:main;overflow:auto;min-width:0}
.wrap{max-width:980px;margin:0 auto;padding:24px 20px 60px}
h1{font-size:26px;margin:4px 0 4px} h2{font-size:20px;margin:0 0 14px}
.sub{color:var(--muted);margin:0 0 22px}
.contents{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.card{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:start;padding:12px 14px;background:var(--panel);
      border:1px solid var(--line);border-radius:10px;text-decoration:none;box-shadow:var(--shadow)}
.card:hover{border-color:var(--accent)}
.card .n{font-size:22px;font-weight:800;color:var(--accent);line-height:1}
.card .t{font-weight:650;line-height:1.25}
.card .o{font-size:12px;color:var(--muted);margin-top:3px}
.bar{height:4px;background:var(--line);border-radius:3px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.rows{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.rows a{display:grid;grid-template-columns:70px 1fr auto;gap:10px;padding:9px 14px;border-top:1px solid var(--line);text-decoration:none}
.rows a:first-child{border-top:0}
.rows a:hover{background:var(--hover)}
.rows .pn{font-weight:700;font-variant-numeric:tabular-nums}
.rows .h{line-height:1.3}
.rows .snip{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.rows mark{background:#ffe08a;color:#000;border-radius:2px}
.pager{position:sticky;top:0;z-index:3;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 14px;
       background:var(--panel);border-bottom:1px solid var(--line)}
.pager button,.pager a.btn{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:6px 12px;
       font:inherit;cursor:pointer;text-decoration:none}
.pager button:hover,.pager a.btn:hover{border-color:var(--accent)}
.pager .where{font-weight:650}
.pager .crumb{color:var(--muted);font-size:13px;flex:1;min-width:160px}
.pager .zoom{margin-left:auto;display:flex;gap:4px}
.pager .zoom button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.stage{padding:0;display:flex;justify-content:center;align-items:flex-start;overflow:auto;min-height:0;touch-action:pan-x pan-y;overscroll-behavior:contain}
.stage img{background:var(--page);box-shadow:var(--shadow);max-width:none;height:auto;display:block;user-select:none;-webkit-user-select:none;-webkit-user-drag:none;touch-action:pan-x pan-y}
.stage.z100 img{max-width:none;width:1275px}
.stage.z150 img{max-width:none;width:1900px}
.note{font-size:12.5px;color:var(--muted);text-align:center;padding:0 16px 30px}
@media (max-width: 860px){
  body{grid-template-columns:1fr;grid-template-areas:"top" "main"}
  nav#toc{position:fixed;inset:57px 0 0 0;z-index:6;display:none}
  body.navopen nav#toc{display:block}
  .burger{display:block}
  .brand span{display:none}
  .jump{width:80px}
  .stage{padding:0}
  .pager .crumb{display:none}
  header{padding:4px 6px;gap:5px}
  .search input,.jump input{padding:5px}
  .pager{padding:3px 5px;gap:4px}
  .pager button{padding:3px 8px}
  body:has(.stage){grid-template-rows:34px minmax(0,1fr)}
  body:has(.stage) header .search,body:has(.stage) header .jump{display:none}
  body:has(.stage) main{display:flex;flex-direction:column;min-height:0;overflow:hidden}
  body:has(.stage) .stage{flex:1;min-height:0}

}
</style>
</head>
<body>
<header>
  <button class="burger" id="burger" aria-label="Оглавление">☰</button>
  <a class="brand" href="#/"><i class="wing"></i><b>GL1800</b><span>сервисное руководство · RU</span></a>
  <div class="search"><input id="q" type="search" placeholder="Поиск по тексту: датчик крена, замена масла…" autocomplete="off"></div>
  <div class="jump"><input id="jump" placeholder="20-8" title="Перейти к странице (номер как в руководстве, например 20-8, или № страницы PDF)"></div>
</header>
<nav id="toc"></nav>
<main id="main"></main>
<script src="data.js"></script>
<script>
(function(){
const M = window.MANUAL, P = M.pages, S = M.sections;
const byNum = {}; P.forEach(p => { if (p.num) byNum[p.num.toLowerCase()] = p.p; });
const main = document.getElementById('main'), toc = document.getElementById('toc');
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = s => s.toLowerCase().replace(/ё/g,'е');
let zoom = 1; let currentPage = 0;
function fitScale(stage){return Math.min((stage.clientWidth||innerWidth)/1275,(stage.clientHeight||innerHeight)/1650)}

function pageLabel(p){ return p.num || ('стр. ' + p.p); }
function secOf(p){ return S.find(s => s.id === p.sec); }

// ---------- sidebar
toc.innerHTML = S.map(s => {
  const pages = P.filter(p => p.sec === s.id);
  const done = pages.filter(p => p.ru).length;
  return `<div class="sec" data-s="${s.id}"><button><span class="num">${esc(s.label)}</span>
    <span class="t">${esc(s.ru)}</span><span class="cnt">${pages.length}</span></button>
    <div class="plist">${pages.map(p => `<a href="#/p/${p.p}" data-p="${p.p}"><span class="pn">${esc(pageLabel(p))}</span>
      <span>${esc(p.title || '—')}${p.ru ? '' : '<span class="en">EN</span>'}</span></a>`).join('')}</div></div>`;
}).join('');
toc.querySelectorAll('.sec>button').forEach(b => b.addEventListener('click', () => {
  const el = b.parentElement; el.classList.toggle('open');
  if (el.classList.contains('open')) location.hash = '#/s/' + el.dataset.s;
}));
toc.addEventListener('click', e => { if (e.target.closest('a')) document.body.classList.remove('navopen'); });
document.getElementById('burger').onclick = () => document.body.classList.toggle('navopen');

// ---------- views
function home(){
  const total = P.length, ru = P.filter(p => p.ru).length;
  main.innerHTML = `<div class="wrap"><h1>Honda GL1800 Gold Wing</h1>
   <p class="sub">Сервисное руководство GL1800/GL1800A, перевод на русский. Переведено страниц: ${ru} из ${total}.
   Выберите раздел — откроется список его страниц.</p>
   <div class="contents">${S.map(s => {
      const pages = P.filter(p => p.sec === s.id), done = pages.filter(p => p.ru).length;
      return `<a class="card" href="#/s/${s.id}"><div class="n">${esc(s.label)}</div><div><div class="t">${esc(s.ru)}</div>
        <div class="o">${pages.length} стр.</div>
        <div class="bar"><i style="width:${pages.length ? Math.round(100*done/pages.length) : 0}%"></i></div></div></a>`;
   }).join('')}</div></div>`;
  markToc(null, null);
}
function section(id){
  const s = S.find(x => x.id === id); if (!s) return home();
  const pages = P.filter(p => p.sec === id);
  main.innerHTML = `<div class="wrap"><p class="sub" style="margin:0 0 6px"><a href="#/">Оглавление</a> / раздел ${esc(s.label)}</p>
    <h1>${esc(s.ru)}</h1>
    <div class="rows">${pages.map(p => `<a href="#/p/${p.p}"><span class="pn">${esc(pageLabel(p))}</span>
       <span class="h">${esc(p.title || '—')}${p.sub ? `<span class="snip">${esc(p.sub)}</span>` : ''}</span>
       <span>${p.ru ? '' : '<span class="en">EN</span>'}</span></a>`).join('')}</div></div>`;
  markToc(id, null);
}
function page(n){
  const i=P.findIndex(p=>p.p===n);if(i<0)return home();
  const p=P[i],s=secOf(p),prev=P[i-1],next=P[i+1];currentPage=n;zoom=1;
  main.innerHTML=`<div class="pager">
    <button id="pv" ${prev?'':'disabled'}>←</button>
    <span class="where">${esc(pageLabel(p))}</span>
    <button id="nx" ${next?'':'disabled'}>→</button>
    <button id="fit" title="Показать страницу целиком">⛶</button>
    <span class="crumb"><a href="#/s/${s.id}">${esc(s.ru)}</a></span>
  </div><div class="stage" id="stage"><img id="img" draggable="false" src="pages/p${String(p.p).padStart(3,'0')}.png" alt="${esc(pageLabel(p))}"></div>`;
  const stage=document.getElementById('stage'),img=document.getElementById('img');
  let scale=1,base=1,pinch=null;
  function apply(){img.style.width=Math.round(1275*scale)+'px';img.style.height=Math.round(1650*scale)+'px'}
  function fit(){scale=fitScale(stage);apply();stage.scrollTop=0;stage.scrollLeft=0}
  requestAnimationFrame(fit);img.onload=fit;
  if(prev)document.getElementById('pv').onclick=()=>location.hash='#/p/'+prev.p;
  if(next)document.getElementById('nx').onclick=()=>location.hash='#/p/'+next.p;
  document.getElementById('fit').onclick=fit;
  function distance(t){return Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY)||1}
  stage.addEventListener('touchstart',e=>{if(e.touches.length===2){
    const r=stage.getBoundingClientRect(),cx=(e.touches[0].clientX+e.touches[1].clientX)/2-r.left,cy=(e.touches[0].clientY+e.touches[1].clientY)/2-r.top;
    pinch={d:distance(e.touches),base:scale,cx,cy,x:stage.scrollLeft+cx,y:stage.scrollTop+cy};e.preventDefault();
  }},{passive:false});
  stage.addEventListener('touchmove',e=>{if(pinch&&e.touches.length===2){
    e.preventDefault();scale=Math.max(.1,Math.min(4,pinch.base*distance(e.touches)/pinch.d));apply();
    stage.scrollLeft=Math.max(0,pinch.x*scale/pinch.base-pinch.cx);
    stage.scrollTop=Math.max(0,pinch.y*scale/pinch.base-pinch.cy);
  }},{passive:false});
  stage.addEventListener('touchend',e=>{if(e.touches.length<2)pinch=null},{passive:false});
  if(next){const pre=new Image();pre.src=`pages/p${String(next.p).padStart(3,'0')}.png`;}
  markToc(s.id,p.p);
}
function search(q){
  const words = norm(q).split(/\s+/).filter(Boolean);
  if (!words.length) return home();
  const res = [];
  for (const p of P) {
    const t = p.textN || (p.textN = norm(p.text || ''));
    if (words.every(w => t.includes(w))) {
      const k = t.indexOf(words[0]), a = Math.max(0, k - 50);
      res.push({p, snip: (a ? '…' : '') + p.text.slice(a, k + 110) + '…'});
      if (res.length >= 300) break;
    }
  }
  const hl = s => { let h = esc(s); words.forEach(w => { const re = new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/е/g,'[её]'), 'gi'); h = h.replace(re, m => `<mark>${m}</mark>`); }); return h; };
  main.innerHTML = `<div class="wrap"><h2>Поиск: «${esc(q)}» — ${res.length >= 300 ? '300+' : res.length} стр.</h2>
    <div class="rows">${res.map(r => `<a href="#/p/${r.p.p}"><span class="pn">${esc(pageLabel(r.p))}</span>
      <span class="h">${esc(r.p.title || '')}<span class="snip">${hl(r.snip)}</span></span><span></span></a>`).join('') ||
      '<p style="padding:14px">Ничего не найдено.</p>'}</div></div>`;
  markToc(null, null);
}
function markToc(sid, pn){
  toc.querySelectorAll('.sec').forEach(el => { if (sid && el.dataset.s === sid) el.classList.add('open'); });
  toc.querySelectorAll('.plist a').forEach(a => a.classList.toggle('cur', +a.dataset.p === pn));
  const cur = toc.querySelector('.plist a.cur'); if (cur) cur.scrollIntoView({block:'nearest'});
}
function route(){
  const h = location.hash.slice(1) || '/';
  let m;
  if ((m = h.match(/^\/p\/(\d+)/))) page(+m[1]);
  else if ((m = h.match(/^\/s\/([\w-]+)/))) section(m[1]);
  else if ((m = h.match(/^\/q\/(.*)/))) { const q = decodeURIComponent(m[1]); document.getElementById('q').value = q; search(q); }
  else home();
}
window.addEventListener('hashchange', route);
let tmr; document.getElementById('q').addEventListener('input', e => {
  clearTimeout(tmr); const v = e.target.value.trim();
  tmr = setTimeout(() => { location.hash = v ? '#/q/' + encodeURIComponent(v) : '#/'; }, 250);
});
document.getElementById('jump').addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const v = e.target.value.trim().toLowerCase().replace(/\s+/g,'').replace(/[–—]/g,'-');
  const n = byNum[v] || (/^\d+$/.test(v) && P.find(p => p.p === +v) ? +v : null);
  if (n) { location.hash = '#/p/' + n; e.target.value = ''; e.target.blur(); }
  else e.target.style.borderColor = 'var(--accent)';
});
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === '/') { e.preventDefault(); document.getElementById('q').focus(); }
  const m = location.hash.match(/^#\/p\/(\d+)/); if (!m) return;
  const i = P.findIndex(p => p.p === +m[1]);
  if (e.key === 'ArrowRight' && P[i+1]) location.hash = '#/p/' + P[i+1].p;
  if (e.key === 'ArrowLeft' && P[i-1]) location.hash = '#/p/' + P[i-1].p;
});
route();
})();
</script>
</body>
</html>
